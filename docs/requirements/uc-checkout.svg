M187.92,615.686 L200.92,630.686" style="stroke:#5B6B8C;stroke-width:0.5;" fill="none"/><text x="142" y="646.719" fill="#1F2937" font-size="14" textLength="91.841">Khách vãng lai</text><text x="142" y="664.328" fill="#1F2937" font-size="14" textLength="46.676">(Guest)</text></g><!--entity Customer--><g class="entity" data-qualified-name="Customer" id="ent0002" data-source-line="20"><ellipse cx="43.365" cy="580.686" rx="8" ry="8" fill="#EEF2FB" style="stroke:#5B6B8C;stroke-width:0.5;"/><path d="M43.365,588.686 L43.365,615.686 M30.365,596.686 L56.365,596.686 M43.365,615.686 L30.365,630.686 M43.365,615.686 L56.365,630.686" style="stroke:#5B6B8C;stroke-width:0.5;" fill="none"/><text x="6" y="646.719" fill="#1F2937" font-size="14" textLength="74.73">Khách hàng</text><text x="6" y="664.328" fill="#1F2937" font-size="14" textLength="70.007">(Customer)</text></g><!--entity Pay--><g class="entity" data-qualified-name="Pay" id="ent0003" data-source-line="21"><ellipse cx="1156.982" cy="72.295" rx="8" ry="8" fill="#EEF2FB" style="stroke:#5B6B8C;stroke-width:0.5;"/><path d="M1156.982,80.295 L1156.982,107.295 M1143.982,88.295 L1169.982,88.295 M1156.982,107.295 L1143.982,122.295 M1156.982,107.295 L1169.982,122.295" style="stroke:#5B6B8C;stroke-width:0.5;" fill="none"/><text x="1106" y="138.328" fill="#1F2937" font-size="14" textLength="100.393">VNPay sandbox</text><text x="1106" y="155.938" fill="#1F2937" font-size="14" textLength="101.965">(hệ thống ngoài)</text><text x="1123.517" y="60.719" fill="#1F2937" font-size="14" textLength="66.931" font-style="italic">«External»</text></g><g class="entity" data-qualified-name="GMN20" id="ent0021" data-source-line="46"><path d="M744,560.686 L744,610.806 L623.38,621.446 L744,618.806 L744,652.443 A0,0 0 0 0 744,652.443 L1039.65,652.443 A0,0 0 0 0 1039.65,652.443 L1039.65,570.686 L1029.65,560.686 L744,560.686 A0,0 0 0 0 744,560.686" style="stroke:#D97706;stroke-width:0.5;" fill="#FEF3C7"/><path d="M1029.65,560.686 L1029.65,570.686 L1039.65,570.686 L1029.65,560.686" style="stroke:#D97706;stroke-width:0.5;" fill="#FEF3C7"/><text x="750" y="579.181" fill="#1F2937" font-size="13" textLength="237.091">Điều kiện extend: khách chưa đăng nhập</text><text x="750" y="595.532" fill="#1F2937" font-size="13" textLength="274.65">hoặc phiên đăng nhập đã hết hạn (API trả 401).</text><text x="750" y="611.884" fill="#1F2937" font-size="13" textLength="254.712">Chưa có đơn: đăng nhập xong mới tạo đơn.</text><text x="750" y="628.235" fill="#1F2937" font-size="13" textLength="234.755">Đã có đơn: đăng nhập lại đúng tài khoản</text><text x="750" y="644.587" fill="#1F2937" font-size="13" textLength="222.13">rồi trả tiếp đơn cũ, không tạo đơn mới.</text></g><g class="entity" data-qualified-name="GMN23" id="ent0024" data-source-line="54"><path d="M741,314.686 L741,340.106 L647.07,333.776 L741,348.106 L741,406.443 A0,0 0 0 0 741,406.443 L1042.922,406.443 A0,0 0 0 0 1042.922,406.443 L1042.922,324.686 L1032.922,314.686 L741,314.686 A0,0 0 0 0 741,314.686" style="stroke:#D97706;stroke-width:0.5;" fill="#FEF3C7"/><path d="M1032.922,314.686 L1032.922,324.686 L1042.922,324.686 L1032.922,314.686" style="stroke:#D97706;stroke-width:0.5;" fill="#FEF3C7"/><text x="747" y="333.181" fill="#1F2937" font-size="13" textLength="221.749">Điều kiện extend: lần thanh toán trước</text><text x="747" y="349.532" fill="#1F2937" font-size="13" textLength="263.015">thất bại (IPN/QueryDR xác nhận, kể cả khách</text><text x="747" y="365.884" fill="#1F2937" font-size="13" textLength="280.922">hủy trên VNPay), đơn đang PAYMENT_FAILED.</text><text x="747" y="382.235" fill="#1F2937" font-size="13" textLength="215.211">Khách bấm "Thử lại": trả lại cho đúng</text><text x="747" y="398.587" fill="#1F2937" font-size="13" textLength="160.716">đơn cũ, không tạo đơn mới.</text></g><g class="entity" data-qualified-name="GMN26" id="ent0027" data-source-line="62"><path d="M739,155.686 L739,213.686 L669.9,217.686 L739,221.686 L739,280.146 A0,0 0 0 0 739,280.146 L1044.692,280.146 A0,0 0 0 0 1044.692,280.146 L1044.692,165.686 L1034.692,155.686 L739,155.686 A0,0 0 0 0 739,155.686" style="stroke:#D97706;stroke-width:0.5;" fill="#FEF3C7"/><path d="M1034.692,155.686 L1034.692,165.686 L1044.692,165.686 L1034.692,155.686" style="stroke:#D97706;stroke-width:0.5;" fill="#FEF3C7"/><text x="745" y="174.181" fill="#1F2937" font-size="13" textLength="284.692">Bất đồng bộ: API tạo Payment PENDING và URL</text><text x="745" y="190.532" fill="#1F2937" font-size="13" textLength="247.133">đã ký, khách trả trên trang VNPay. Kết quả</text><text x="745" y="206.884" fill="#1F2937" font-size="13" textLength="264.507">do IPN hoặc QueryDR đã xác thực quyết định</text><text x="745" y="223.235" fill="#1F2937" font-size="13" textLength="189.306">(BR-11); trang return chỉ hiển thị.</text><text x="745" y="239.587" fill="#1F2937" font-size="13" textLength="263.732">Quay lại khi còn Payment PENDING còn hạn:</text><text x="745" y="255.938" fill="#1F2937" font-size="13" textLength="213.884">tiếp tục bằng URL cũ (A6); tối đa một</text><text x="745" y="272.29" fill="#1F2937" font-size="13" textLength="187.688">PENDING cho mỗi đơn (BR-10).</text></g><g class="entity" data-qualified-name="GMN29" id="ent0030" data-source-line="72"><path d="M744.5,687.686 L744.5,722.016 L672.82,722.286 L744.5,730.016 L744.5,779.443 A0,0 0 0 0 744.5,779.443 L1039.332,779.443 A0,0 0 0 0 1039.332,779.443 L1039.332,697.686 L1029.332,687.686 L744.5,687.686 A0,0 0 0 0 744.5,687.686" style="stroke:#D97706;stroke-width:0.5;" fill="#FEF3C7"/><path d="M1029.332,687.686 L1029.332,697.686 L1039.332,697.686 L1029.332,687.686" style="stroke:#D97706;stroke-width:0.5;" fill="#FEF3C7"/><text x="750.5" y="706.181" fill="#1F2937" font-size="13" textLength="273.832">Bị chặn 409 PAYMENT_IN_PROGRESS khi có</text><text x="750.5" y="722.532" fill="#1F2937" font-size="13" textLength="236.298">Payment PENDING còn hạn; quá hạn thì</text><text x="750.5" y="738.884" fill="#1F2937" font-size="13" textLength="231.651">đối soát QueryDR trước rồi mới xét hủy.</text><text x="750.5" y="755.235" fill="#1F2937" font-size="13" textLength="255.347">Chưa kết luận: chặn tới expiresAt + 15 phút,</text><text x="750.5" y="771.587" fill="#1F2937" font-size="13" textLength="270.956">sau đó payment đóng FAILED (EXPIRED, D6).</text></g><!--link Customer to Guest--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" id="lnk4" data-source-line="23" data-link-type="extension"><path d="M81.2,619.686 C99.67,619.686 104.23,619.686 123.77,619.686" style="stroke:#5B6B8C;stroke-width:1;" fill="none" id="Customer-to-Guest"/><polygon points="141.77,619.686,123.77,613.686,123.77,625.686,141.77,619.686" fill="none" style="stroke:#5B6B8C;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Customer to UC04--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" id="lnk12" data-source-line="34" data-link-type="association"><path d="M81.02,588.986 C98.4,576.126 120.12,562.386 142,554.686 C231.33,523.226 338.38,514.936 419.62,514.126" style="stroke:#5B6B8C;stroke-width:1;" fill="none" id="Customer-UC04"/></g><!--link Customer to UC06--><g class="link" data-entity-1="ent0002" data-entity-2="ent0010" id="lnk13" data-source-line="35" data-link-type="association"><path d="M81.44,650.846 C98.73,663.636 120.27,677.186 142,684.686 C230.94,715.396 337.29,722.416 418.33,722.156" style="stroke:#5B6B8C;stroke-width:1;" fill="none" id="Customer-UC06"/></g><!--link Guest to UC03--><g class="link" data-entity-1="ent0001" data-entity-2="ent0011" id="lnk14" data-source-line="36" data-link-type="association"><path d="M234.02,620.446 C292.5,621.436 395.51,623.176 466.76,624.376" style="stroke:#5B6B8C;stroke-width:1;" fill="none" id="Guest-UC03"/></g><!--link UC04 to UC041--><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" id="lnk15" data-source-line="38" data-link-type="dependency"><path d="M545.5,490.596 C545.5,474.466 545.5,459.306 545.5,443.266" style="stroke:#5B6B8C;stro