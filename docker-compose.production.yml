name: brewlite-production
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: brewlite
      POSTGRES_USER: brewlite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
    volumes:
      - production_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U brewlite -d brewlite"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    image: ${REGISTRY_IMAGE:?Required}-api:${RELEASE_SHA:?Required}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://brewlite:${POSTGRES_PASSWORD}@db:5432/brewlite?schema=public
      JWT_SECRET: ${JWT_SECRET:?Required}
      CORS_ORIGINS: ${CORS_ORIGINS:?Required}
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:4000:4000"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
  web:
    image: ${REGISTRY_IMAGE:?Required}-web:${RELEASE_SHA:?Required}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  production_pgdata: