name: brewlite-task5
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brewlite
      POSTGRES_USER: brewlite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U brewlite -d brewlite"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    image: brewlite-api:local
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://brewlite:${POSTGRES_PASSWORD}@db:5432/brewlite?schema=public
    depends_on:
      db:
        condition: service_healthy
    command: [npm, run, 'prisma:migrate']
    restart: 'no'
  api:
    image: brewlite-api:local
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://brewlite:${POSTGRES_PASSWORD}@db:5432/brewlite?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET with at least 32 characters}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      PORT: 4000
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports: ["127.0.0.1:${API_PORT:-4000}:4000"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
  web:
    image: brewlite-web:local
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      api:
        condition: service_healthy
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  pgdata: